name: Check Statistics Canada tuition and graduate data
on:
  schedule:
    - cron: '29 13 8 * *'
  workflow_dispatch:
concurrency:
  group: tuitiontrail-refresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check tuition and graduate income tables
        run: python3 scripts/refresh.py
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build.py
      - name: Publish the validated archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- web/data/edition.json; then
            git add web/data/edition.json
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh tuition and graduate cohort observations'
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          elif [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            gh workflow run pages.yml --ref main
          fi
